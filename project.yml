name: NanoBuddha
options:
  bundleIdPrefix: com.krisnorthfield
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
targets:
  NanoBuddha:
    type: application
    platform: iOS
    sources:
      - NanoBuddha
    dependencies:
      - target: NanoBuddhaWidgets
        embed: true
    info:
      path: NanoBuddha/Info.plist
      properties:
        CFBundleDisplayName: Nano Buddha
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSHealthUpdateUsageDescription: Nano Buddha saves your meditation minutes to Health as Mindful Minutes.
        NSHealthShareUsageDescription: Nano Buddha saves your meditation minutes to Health as Mindful Minutes.
    entitlements:
      path: NanoBuddha/NanoBuddha.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.krisnorthfield.NanoBuddha]
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  NanoBuddhaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - NanoBuddhaWidgets
      - NanoBuddha/Model/Store.swift
      - NanoBuddha/Model/Session.swift
      - NanoBuddha/Model/DurationPlanner.swift
      - NanoBuddha/Model/BeginSitIntent.swift
      - NanoBuddha/Resources/Assets.xcassets
    info:
      path: NanoBuddhaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Nano Buddha
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NanoBuddhaWidgets/NanoBuddhaWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.krisnorthfield.NanoBuddha]
    settings:
      base:
        # iOS ignores an extension whose bundle id is not prefixed by the app's.
        PRODUCT_BUNDLE_IDENTIFIER: com.krisnorthfield.NanoBuddha.NanoBuddhaWidgets
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  NanoBuddhaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NanoBuddhaTests
    dependencies:
      - target: NanoBuddha
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
  NanoBuddhaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NanoBuddhaUITests
    dependencies:
      - target: NanoBuddha
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NanoBuddha:
    build:
      targets:
        NanoBuddha: all
        NanoBuddhaWidgets: all
        NanoBuddhaTests: [test]
        NanoBuddhaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NanoBuddhaTests
        - NanoBuddhaUITests
