name: NanoBuddha
options:
  bundleIdPrefix: com.krisnorthfield
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
    tvOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # xcodegen does not set this; without it Color.accentColor is system blue.
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    GENERATE_INFOPLIST_FILE: NO
    # The Mac app group: a Mac group container is only open to a team-prefixed id (see CLAUDE.md).
    NANOBUDDHA_MAC_APP_GROUP: $(DEVELOPMENT_TEAM).com.krisnorthfield.NanoBuddha
targetTemplates:
  WidgetExtension:
    type: app-extension
    sources:
      - ${target_name}
      - NanoBuddha/Model/Store.swift
      - NanoBuddha/Model/Session.swift
      - NanoBuddha/Model/DurationPlanner.swift
      - NanoBuddha/Resources/Assets.xcassets
    info:
      path: ${target_name}/Info.plist
      properties:
        CFBundleDisplayName: Nano Buddha
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ${target_name}/${target_name}.entitlements
    settings:
      base:
        SKIP_INSTALL: YES
targets:
  NanoBuddha:
    type: application
    platform: iOS
    sources:
      - NanoBuddha
    dependencies:
      - target: NanoBuddhaWidgets
        embed: true
      - target: NanoBuddhaWatch
        embed: true
    info:
      path: NanoBuddha/Info.plist
      properties:
        CFBundleDisplayName: Nano Buddha
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSHealthUpdateUsageDescription: Nano Buddha saves your meditation minutes to Health as Mindful Minutes.
        NSHealthShareUsageDescription: Nano Buddha saves your meditation minutes to Health as Mindful Minutes.
    entitlements:
      path: NanoBuddha/NanoBuddha.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.krisnorthfield.NanoBuddha
        com.apple.security.application-groups: [group.com.krisnorthfield.NanoBuddha]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
  NanoBuddhaWidgets:
    templates: [WidgetExtension]
    platform: iOS
    sources:
      - NanoBuddha/Model/BeginSitIntent.swift
      - NanoBuddha/Model/SitActivity.swift
    entitlements:
      properties:
        com.apple.security.application-groups: [group.com.krisnorthfield.NanoBuddha]
    settings:
      base:
        # iOS ignores an extension whose bundle id is not prefixed by the app's.
        PRODUCT_BUNDLE_IDENTIFIER: com.krisnorthfield.NanoBuddha.NanoBuddhaWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
  NanoBuddhaWatch:
    type: application
    platform: watchOS
    sources:
      - NanoBuddhaWatch
      - NanoBuddha/Model/Store.swift
      - NanoBuddha/Model/Session.swift
      - NanoBuddha/Model/DurationPlanner.swift
      - NanoBuddha/Model/HealthWriter.swift
      - NanoBuddha/Model/Bell.swift
      - NanoBuddha/Model/Sit.swift
      - NanoBuddha/Model/Sync.swift
      - NanoBuddha/Model/CloudSync.swift
      - NanoBuddha/Model/BeginSitIntent.swift
      - NanoBuddha/Model/AppShortcuts.swift
      - NanoBuddha/Views/PrimaryButton.swift
      - NanoBuddha/Views/RootView.swift
      - NanoBuddha/Views/NudgeRow.swift
      - NanoBuddha/Views/DoneView.swift
      - NanoBuddha/Resources/bowl.wav
      - NanoBuddha/Resources/Assets.xcassets
      - NanoBuddha/AppIcon.icon
    dependencies:
      - target: NanoBuddhaWatchWidgets
        embed: true
    info:
      path: NanoBuddhaWatch/Info.plist
      properties:
        CFBundleDisplayName: Nano Buddha
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.krisnorthfield.NanoBuddha
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes: [mindfulness]
        NSHealthUpdateUsageDescription: Nano Buddha saves your meditation minutes to Health as Mindful Minutes.
        NSHealthShareUsageDescription: Nano Buddha saves your meditation minutes to Health as Mindful Minutes.
    entitlements:
      path: NanoBuddhaWatch/NanoBuddhaWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.krisnorthfield.NanoBuddha
        com.apple.security.application-groups: [group.com.krisnorthfield.NanoBuddha]
    settings:
      base:
        # Same rule as the widget: the watch app's bundle id must be prefixed by the app's.
        PRODUCT_BUNDLE_IDENTIFIER: com.krisnorthfield.NanoBuddha.watchkitapp
  NanoBuddhaWatchWidgets:
    templates: [WidgetExtension]
    platform: watchOS
    sources:
      - NanoBuddhaWidgets/SitWidget.swift
    entitlements:
      properties:
        com.apple.security.application-groups: [group.com.krisnorthfield.NanoBuddha]
    settings:
      base:
        # Prefixed by the watch app's bundle id, the host of this extension.
        PRODUCT_BUNDLE_IDENTIFIER: com.krisnorthfield.NanoBuddha.watchkitapp.NanoBuddhaWatchWidgets
  NanoBuddhaTV:
    type: application
    platform: tvOS
    sources:
      - NanoBuddhaTV
      - NanoBuddha/Model/Store.swift
      - NanoBuddha/Model/Session.swift
      - NanoBuddha/Model/DurationPlanner.swift
      - NanoBuddha/Model/Bell.swift
      - NanoBuddha/Model/Sit.swift
      - NanoBuddha/Model/CloudSync.swift
      - NanoBuddha/Views/PrimaryButton.swift
      - NanoBuddha/Views/Starfield.swift
      - NanoBuddha/Views/HistoryView.swift
      - NanoBuddha/Views/RootView.swift
      - NanoBuddha/Views/NudgeRow.swift
      - NanoBuddha/Views/DoneView.swift
      - NanoBuddha/Resources/bowl.wav
      - NanoBuddha/Resources/Assets.xcassets
      - NanoBuddhaTV/Assets.xcassets
    entitlements:
      path: NanoBuddhaTV/NanoBuddhaTV.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.krisnorthfield.NanoBuddha
    info:
      path: NanoBuddhaTV/Info.plist
      properties:
        CFBundleDisplayName: Nano Buddha
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # Same bundle id as the iPhone app: a tvOS counterpart shares it (universal purchase).
        PRODUCT_BUNDLE_IDENTIFIER: com.krisnorthfield.NanoBuddha
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
  NanoBuddhaMac:
    type: application
    platform: macOS
    sources:
      - NanoBuddhaMac
      - NanoBuddha/Model/Store.swift
      - NanoBuddha/Model/Session.swift
      - NanoBuddha/Model/DurationPlanner.swift
      - NanoBuddha/Model/Bell.swift
      - NanoBuddha/Model/Sit.swift
      - NanoBuddha/Model/CloudSync.swift
      - NanoBuddha/Model/WeekLog.swift
      - NanoBuddha/Views/PrimaryButton.swift
      - NanoBuddha/Views/Starfield.swift
      - NanoBuddha/Views/HistoryView.swift
      - NanoBuddha/Views/DoneView.swift
      - NanoBuddha/Views/RootView.swift
      - NanoBuddha/Views/NudgeRow.swift
      - NanoBuddha/Resources/bowl.wav
      - NanoBuddha/Resources/Assets.xcassets
      - NanoBuddha/AppIcon.icon
    dependencies:
      - target: NanoBuddhaMacWidgets
        embed: true
    entitlements:
      path: NanoBuddhaMac/NanoBuddhaMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.krisnorthfield.NanoBuddha
        com.apple.security.application-groups: [$(NANOBUDDHA_MAC_APP_GROUP)]
    info:
      path: NanoBuddhaMac/Info.plist
      properties:
        CFBundleDisplayName: Nano Buddha
        NanoBuddhaAppGroup: $(NANOBUDDHA_MAC_APP_GROUP)  # Store reads the group id from here.
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness  # The Mac App Store needs it.
    settings:
      base:
        # Same bundle id as the iPhone app: a Mac counterpart shares it (universal purchase).
        PRODUCT_BUNDLE_IDENTIFIER: com.krisnorthfield.NanoBuddha
        PRODUCT_NAME: Nano Buddha  # The file name in Applications and in the widget gallery.
  NanoBuddhaMacWidgets:
    templates: [WidgetExtension]
    platform: macOS
    sources:
      - NanoBuddhaWidgets/SitWidget.swift
    info:
      properties:
        NanoBuddhaAppGroup: $(NANOBUDDHA_MAC_APP_GROUP)
    entitlements:
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(NANOBUDDHA_MAC_APP_GROUP)]
    settings:
      base:
        # Prefixed by the Mac app's bundle id, the host of this extension.
        PRODUCT_BUNDLE_IDENTIFIER: com.krisnorthfield.NanoBuddha.NanoBuddhaMacWidgets
  NanoBuddhaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NanoBuddhaTests
    dependencies:
      - target: NanoBuddha
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  NanoBuddhaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NanoBuddhaUITests
    dependencies:
      - target: NanoBuddha
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NanoBuddha:
    build:
      targets:
        NanoBuddha: all
        NanoBuddhaWidgets: all
        NanoBuddhaWatch: all
        NanoBuddhaWatchWidgets: all
        NanoBuddhaTests: [test]
        NanoBuddhaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NanoBuddhaTests
        - NanoBuddhaUITests
  NanoBuddhaWatch:
    build:
      targets:
        NanoBuddhaWatch: all
        NanoBuddhaWatchWidgets: all
    run:
      config: Debug
  NanoBuddhaTV:
    build:
      targets:
        NanoBuddhaTV: all
    run:
      config: Debug
  NanoBuddhaMac:
    build:
      targets:
        NanoBuddhaMac: all
        NanoBuddhaMacWidgets: all
    run:
      config: Debug
