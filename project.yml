name: NanoBuddha
options:
  bundleIdPrefix: com.krisnorthfield
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
targets:
  NanoBuddha:
    type: application
    platform: iOS
    sources:
      - NanoBuddha
    dependencies:
      - target: NanoBuddhaWidgets
        embed: true
      - target: NanoBuddhaWatch
        embed: true
    info:
      path: NanoBuddha/Info.plist
      properties:
        CFBundleDisplayName: Nano Buddha
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSHealthUpdateUsageDescription: Nano Buddha saves your meditation minutes to Health as Mindful Minutes.
        NSHealthShareUsageDescription: Nano Buddha saves your meditation minutes to Health as Mindful Minutes.
    entitlements:
      path: NanoBuddha/NanoBuddha.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.krisnorthfield.NanoBuddha]
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  NanoBuddhaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - NanoBuddhaWidgets
      - NanoBuddha/Model/Store.swift
      - NanoBuddha/Model/Session.swift
      - NanoBuddha/Model/DurationPlanner.swift
      - NanoBuddha/Model/BeginSitIntent.swift
      - NanoBuddha/Model/SitActivity.swift
      - NanoBuddha/Resources/Assets.xcassets
    info:
      path: NanoBuddhaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Nano Buddha
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NanoBuddhaWidgets/NanoBuddhaWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.krisnorthfield.NanoBuddha]
    settings:
      base:
        # iOS ignores an extension whose bundle id is not prefixed by the app's.
        PRODUCT_BUNDLE_IDENTIFIER: com.krisnorthfield.NanoBuddha.NanoBuddhaWidgets
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  NanoBuddhaWatch:
    type: application
    platform: watchOS
    sources:
      - NanoBuddhaWatch
      - NanoBuddha/Model/Store.swift
      - NanoBuddha/Model/Session.swift
      - NanoBuddha/Model/DurationPlanner.swift
      - NanoBuddha/Model/HealthWriter.swift
      - NanoBuddha/Model/Bell.swift
      - NanoBuddha/Model/Sit.swift
      - NanoBuddha/Model/Sync.swift
      - NanoBuddha/Model/BeginSitIntent.swift
      - NanoBuddha/Model/AppShortcuts.swift
      - NanoBuddha/Views/PrimaryButton.swift
      - NanoBuddha/Resources/bowl.wav
      - NanoBuddha/Resources/Assets.xcassets
      - NanoBuddha/AppIcon.icon
    dependencies:
      - target: NanoBuddhaWatchWidgets
        embed: true
    info:
      path: NanoBuddhaWatch/Info.plist
      properties:
        CFBundleDisplayName: Nano Buddha
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.krisnorthfield.NanoBuddha
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes: [mindfulness]
        NSHealthUpdateUsageDescription: Nano Buddha saves your meditation minutes to Health as Mindful Minutes.
        NSHealthShareUsageDescription: Nano Buddha saves your meditation minutes to Health as Mindful Minutes.
    entitlements:
      path: NanoBuddhaWatch/NanoBuddhaWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.krisnorthfield.NanoBuddha]
    settings:
      base:
        # Same rule as the widget: the watch app's bundle id must be prefixed by the app's.
        PRODUCT_BUNDLE_IDENTIFIER: com.krisnorthfield.NanoBuddha.watchkitapp
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  NanoBuddhaWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - NanoBuddhaWatchWidgets
      - NanoBuddhaWidgets/SitWidget.swift
      - NanoBuddha/Model/Store.swift
      - NanoBuddha/Model/Session.swift
      - NanoBuddha/Model/DurationPlanner.swift
      - NanoBuddha/Resources/Assets.xcassets
    info:
      path: NanoBuddhaWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Nano Buddha
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NanoBuddhaWatchWidgets/NanoBuddhaWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.krisnorthfield.NanoBuddha]
    settings:
      base:
        # Prefixed by the watch app's bundle id, the host of this extension.
        PRODUCT_BUNDLE_IDENTIFIER: com.krisnorthfield.NanoBuddha.watchkitapp.NanoBuddhaWatchWidgets
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  NanoBuddhaTV:
    type: application
    platform: tvOS
    sources:
      - NanoBuddhaTV
      - NanoBuddha/Model/Store.swift
      - NanoBuddha/Model/Session.swift
      - NanoBuddha/Model/DurationPlanner.swift
      - NanoBuddha/Model/Bell.swift
      - NanoBuddha/Model/Sit.swift
      - NanoBuddha/Views/PrimaryButton.swift
      - NanoBuddha/Views/Starfield.swift
      - NanoBuddha/Resources/bowl.wav
      - NanoBuddha/Resources/Assets.xcassets
      - NanoBuddhaTV/Assets.xcassets
    info:
      path: NanoBuddhaTV/Info.plist
      properties:
        CFBundleDisplayName: Nano Buddha
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    settings:
      base:
        # Same bundle id as the iPhone app: a tvOS counterpart shares it (universal purchase).
        PRODUCT_BUNDLE_IDENTIFIER: com.krisnorthfield.NanoBuddha
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        GENERATE_INFOPLIST_FILE: NO
  NanoBuddhaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NanoBuddhaTests
    dependencies:
      - target: NanoBuddha
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
  NanoBuddhaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NanoBuddhaUITests
    dependencies:
      - target: NanoBuddha
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NanoBuddha:
    build:
      targets:
        NanoBuddha: all
        NanoBuddhaWidgets: all
        NanoBuddhaWatch: all
        NanoBuddhaWatchWidgets: all
        NanoBuddhaTests: [test]
        NanoBuddhaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NanoBuddhaTests
        - NanoBuddhaUITests
  NanoBuddhaWatch:
    build:
      targets:
        NanoBuddhaWatch: all
        NanoBuddhaWatchWidgets: all
    run:
      config: Debug
  NanoBuddhaTV:
    build:
      targets:
        NanoBuddhaTV: all
    run:
      config: Debug
